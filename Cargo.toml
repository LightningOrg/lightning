[workspace]
resolver = "3"
members = [
    "crates/lightning-core",
    "crates/lightning-macros",
    "crates/lightning",
    "examples/basics",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["A.Sevis"]
repository = "https://github.com/LightningOrg/lightning"

[workspace.dependencies]
lightning = { path = "crates/lightning", version = "0.1.1" }
lightning-core = { path = "crates/lightning-core", version = "0.1.1" }
lightning-macros = { path = "crates/lightning-macros", version = "0.1.1" }

twilight-gateway = "0.18"
twilight-http = "0.18"
twilight-model = "0.18"

songbird = { version = "0.6", default-features = false, features = ["builtin-queue", "driver", "gateway", "rustls", "tungstenite"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
async-trait = "0.1"
inventory = "0.3"

syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
